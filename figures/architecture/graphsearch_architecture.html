<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GraphSearch Architecture</title>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #111827;
      --muted: #4b5563;
      --line: #9ca3af;
      --line-strong: #374151;
      --card: #ffffff;
      --blue: #eef4ff;
      --orange: #fff4e8;
      --green: #eefbf3;
      --red: #fdf1f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .page {
      width: 1660px;
      margin: 0 auto;
      padding: 40px 44px 32px;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 34px;
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-align: center;
      font-weight: 700;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .box {
      fill: var(--card);
      stroke: var(--line-strong);
      stroke-width: 1.6;
      rx: 18;
      ry: 18;
    }

    .box-blue { fill: var(--blue); }
    .box-orange { fill: var(--orange); }
    .box-green { fill: var(--green); }
    .box-red { fill: var(--red); }

    .icon-frame {
      fill: #ffffff;
      stroke: var(--line);
      stroke-width: 1.2;
      rx: 14;
      ry: 14;
    }

    .connector {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node-title {
      font-size: 28px;
      font-weight: 700;
      fill: var(--ink);
      letter-spacing: -0.02em;
    }

    .node-text {
      font-size: 17px;
      fill: var(--muted);
    }

    .formula {
      font-size: 17px;
      fill: #7c2d12;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .icon {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>GraphSearch Architecture</h1>
    <svg viewBox="0 0 1560 540" aria-label="GraphSearch architecture diagram">
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
          <path d="M0,0 L12,6 L0,12 z" fill="#374151"></path>
        </marker>
      </defs>

      <path class="connector" marker-end="url(#arrow)" d="M 390 150 L 500 150 L 500 230 L 610 230" />
      <path class="connector" marker-end="url(#arrow)" d="M 390 390 L 500 390 L 500 270 L 610 270" />
      <path class="connector" marker-end="url(#arrow)" d="M 1010 250 L 1080 250 L 1130 250" />
      <path class="connector" marker-end="url(#arrow)" d="M 1330 330 L 1330 360" />
      <path class="connector" marker-end="url(#arrow)" d="M 1530 425 L 1530 190 L 1355 190 L 1355 170" />

      <rect class="box" x="60" y="70" width="330" height="160"></rect>
      <rect class="icon-frame" x="88" y="108" width="84" height="84"></rect>
      <text class="node-title" x="200" y="132">Codebase snippets</text>
      <text class="node-text" x="200" y="164">Indexed function and method</text>
      <text class="node-text" x="200" y="188">snippets from the repository.</text>
      <g transform="translate(103 123)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M10 9H8" />
          <path class="icon" d="M14 2v5a1 1 0 0 0 1 1h5" />
          <path class="icon" d="M16 13H8" />
          <path class="icon" d="M16 17H8" />
          <path class="icon" d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
        </svg>
      </g>

      <rect class="box" x="60" y="310" width="330" height="160"></rect>
      <rect class="icon-frame" x="88" y="348" width="84" height="84"></rect>
      <text class="node-title" x="200" y="372">User query</text>
      <text class="node-text" x="200" y="404">Natural-language retrieval</text>
      <text class="node-text" x="200" y="428">question posed by the user.</text>
      <g transform="translate(103 363)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2" />
          <circle class="icon" cx="12" cy="7" r="4" />
        </svg>
      </g>

      <rect class="box box-blue" x="610" y="170" width="400" height="160"></rect>
      <rect class="icon-frame" x="638" y="208" width="84" height="84"></rect>
      <text class="node-title" x="750" y="232">Dual encoder</text>
      <text class="node-text" x="750" y="264">Semantic retrieval over code</text>
      <text class="node-text" x="750" y="288">snippets using dense embeddings.</text>
      <g transform="translate(653 223)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M12.255 22H6.5a1 1 0 0 1 0-5h4.57" />
          <path class="icon" d="m22 22-1.879-1.879" />
          <path class="icon" d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v8.29" />
          <circle class="icon" cx="18" cy="18" r="3" />
        </svg>
      </g>

      <rect class="box box-orange" x="1130" y="170" width="400" height="160"></rect>
      <rect class="icon-frame" x="1158" y="208" width="84" height="84"></rect>
      <text class="node-title" x="1270" y="224">AST Expansion</text>
      <text class="node-text" x="1270" y="254">Expand retrieved snippets with</text>
      <text class="node-text" x="1270" y="278">neighbors from the call graph.</text>
      <text class="formula" x="1270" y="306">Out = In ∪ {Neighbour(i) | i ∈ In}</text>
      <g transform="translate(1173 223)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M15 6a9 9 0 0 0-9 9V3" />
          <circle class="icon" cx="18" cy="6" r="3" />
          <circle class="icon" cx="6" cy="18" r="3" />
        </svg>
      </g>

      <rect class="box box-green" x="1130" y="360" width="400" height="130"></rect>
      <rect class="icon-frame" x="1158" y="382" width="84" height="84"></rect>
      <text class="node-title" x="1270" y="418">Cross encoder</text>
      <text class="node-text" x="1270" y="446">Pairwise reranking over</text>
      <text class="node-text" x="1270" y="470">query-snippet candidates.</text>
      <g transform="translate(1173 397)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M3.828 9.56a3.1 3.1 0 0 1-.002 4.865 2 2 0 0 0 1.98 3.425 3.1 3.1 0 0 1 4.211 2.434 2 2 0 0 0 3.958.002 3.1 3.1 0 0 1 4.213-2.431 2 2 0 0 0 1.983-3.424 3.1 3.1 0 0 1 .001-4.866 2 2 0 0 0-1.978-3.425 3.1 3.1 0 0 1-4.214-2.421 2 2 0 0 0-3.961.004A3.1 3.1 0 0 1 5.81 6.135 2 2 0 0 0 3.828 9.56" />
          <circle class="icon" cx="12" cy="12" r="3" />
        </svg>
      </g>

      <rect class="box box-red" x="1180" y="40" width="350" height="130"></rect>
      <rect class="icon-frame" x="1208" y="62" width="84" height="84"></rect>
      <text class="node-title" x="1320" y="98">Final rank</text>
      <text class="node-text" x="1320" y="126">Top-k snippets returned</text>
      <text class="node-text" x="1320" y="150">as the final result.</text>
      <g transform="translate(1223 77)">
        <svg viewBox="0 0 24 24" width="54" height="54">
          <path class="icon" d="M11 17h.01" />
          <path class="icon" d="M11 5h.01" />
          <path class="icon" d="M15 17h.01" />
          <path class="icon" d="M15 5h.01" />
          <path class="icon" d="M19 17h.01" />
          <path class="icon" d="M19 5h.01" />
          <path class="icon" d="m19 9-4 4-4-4-4 4" />
          <path class="icon" d="M3 3v16a2 2 0 0 0 2 2h16" />
          <path class="icon" d="M7 17h.01" />
          <path class="icon" d="M7 5h.01" />
        </svg>
      </g>
    </svg>
  </main>
</body>
</html>
